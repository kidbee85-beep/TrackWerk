name: TrackWerk 1.3 Debian package acceptance
on:
  push:
    branches: [codex/release-1.3.0]
    paths: ['.github/workflows/verify-13-packages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            sha256: 0b9045adee2b57b562df080a916413d0a2d190c2554dc014a8cccd1ccb766647
          - arch: arm64
            runner: ubuntu-24.04-arm
            sha256: d0d423f753f1da7b15938c26b46ebd84a43dbd1eb22532645dd3012d9bfa4946
    runs-on: ${{ matrix.runner }}
    container: debian:13-slim
    steps:
      - run: apt-get update && apt-get install -y ca-certificates curl python3 xvfb xauth
      - name: Download the exact draft release package
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          EXPECTED: ${{ matrix.sha256 }}
        run: |
          python3 - <<'PYCODE'
          import os,json,urllib.request,hashlib
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          api='https://api.github.com/repos/kidbee85-beep/TrackWerk/releases'
          releases=json.load(urllib.request.urlopen(urllib.request.Request(api,headers=headers)))
          release=next(x for x in releases if x['tag_name']=='v1.3.0')
          name='trackwerk_1.3.0-1_'+os.environ['ARCH']+'.deb'
          asset=next(x for x in release['assets'] if x['name']==name)
          headers['Accept']='application/octet-stream'
          data=urllib.request.urlopen(urllib.request.Request(asset['url'],headers=headers)).read()
          assert hashlib.sha256(data).hexdigest()==os.environ['EXPECTED']
          open(name,'wb').write(data)
          print(name,len(data),'SHA256 verified')
          PYCODE
      - name: Install and start the actual Debian package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          apt-get install -y ./trackwerk_1.3.0-1_${ARCH}.deb
          mkdir -p evidence/data/Samples
          printf 'private fixture' > evidence/data/Samples/KEEP.wav
          export TRACKWERK_HOME="$PWD/evidence/data"
          trackwerk --version > evidence/version.txt
          set +e
          SDL_AUDIODRIVER=dummy xvfb-run -a timeout --signal=TERM 10s trackwerk > evidence/first-start.txt 2>&1
          rc=$?
          set -e
          test "$rc" = 124 -o "$rc" = 0
          grep -q 'startup: video first SDL_RenderPresent returned' evidence/first-start.txt
          test "$(find evidence/data/Samples -name '*.wav' | wc -l)" -eq 1529
          test "$(cat evidence/data/Samples/KEEP.wav)" = 'private fixture'
          test -f /usr/share/doc/trackwerk/TrackWerk-1.3-Manual-EN.pdf
          test -f /usr/share/doc/trackwerk/TrackWerk-1.3-Handbuch-DE.pdf
          dpkg -r trackwerk
          test "$(cat evidence/data/Samples/KEEP.wav)" = 'private fixture'
          test "$(find evidence/data/Samples -name '*.wav' | wc -l)" -eq 1529
          printf '%s\n' 'PASS: exact package hash, Debian 13 dependency install, Xvfb window render, 1528 samples and both manuals, existing user file preserved, removal preserves user data. Audio uses dummy backend.' > evidence/RESULT.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: debian-package-${{ matrix.arch }}-acceptance
          path: evidence/
          if-no-files-found: warn
